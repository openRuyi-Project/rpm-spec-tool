name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  analyzer-configurations:
    name: analyzer configurations (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-analyzer-configurations
      - name: Check portable analyzer core
        run: |
          cargo test --locked -p rpm-spec-analyzer --no-default-features \
            --lib registry::tests
          cargo tree --locked -p rpm-spec-analyzer --no-default-features \
            --edges normal,build > "$RUNNER_TEMP/analyzer-core-tree.txt"
          if grep -E 'rpm-spec-repo-|rusqlite|libsqlite3-sys' \
              "$RUNNER_TEMP/analyzer-core-tree.txt"; then
            echo "::error::portable analyzer core includes repository dependencies" >&2
            exit 1
          fi
      - name: Check analyzer repository support
        run: |
          cargo test --locked -p rpm-spec-analyzer --no-default-features \
            --features repo --lib registry::tests
      - name: Check standalone LSP
        run: |
          cargo check --locked -p rpm-spec-lsp
          cargo tree --locked -p rpm-spec-lsp --edges normal,build \
            > "$RUNNER_TEMP/lsp-tree.txt"
          if grep -E 'rpm-spec-repo-|rusqlite|libsqlite3-sys' \
              "$RUNNER_TEMP/lsp-tree.txt"; then
            echo "::error::standalone LSP includes repository dependencies" >&2
            exit 1
          fi
      - name: Check full CLI
        run: cargo check --locked -p rpm-spec-tool
      - name: Check full workspace
        run: cargo check --locked --workspace --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: cargo test --workspace --all-targets

  lints-doc-check:
    # Belt-and-braces sanity check: regenerate doc/lints-list.md from
    # the registry and fail the build if it differs from the committed
    # copy. The same regeneration also runs as a pre-commit hook
    # (.githooks/pre-commit), but the hook is opt-in via
    # `git config core.hooksPath .githooks`, so this job is the
    # authoritative gate that catches PRs which bypass it.
    name: lints-doc-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lints-doc
      - name: Regenerate and diff
        run: |
          cargo run --release --quiet -p rpm-spec-tool -- \
              lints --format markdown > /tmp/lints-list.md
          if ! diff -u doc/lints-list.md /tmp/lints-list.md; then
              echo "::error::doc/lints-list.md is out of date." >&2
              echo "Run: cargo run --release -p rpm-spec-tool -- lints --format markdown > doc/lints-list.md" >&2
              exit 1
          fi

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-check:
    name: publish-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-publish-check
      # The analyzer and CLI use the pinned openRuyi rpm-spec revision and
      # are not published to a registry. Keep a real dry run for the leaf
      # crate that remains publishable.
      - name: Dry-run publish — rpm-spec-profile (must pass)
        run: cargo publish -p rpm-spec-profile --dry-run --allow-dirty
