[package]
name         = "rpm-spec-analyzer"
description  = "Visitor-based static analyzer library for RPM .spec files"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme        = "README.md"
homepage      = "https://github.com/johnlepikhin/rpm-spec-tool"
documentation = "https://docs.rs/rpm-spec-analyzer"
keywords      = ["rpm", "spec", "linter", "static-analysis", "linux"]
categories    = ["development-tools", "parser-implementations"]
publish       = false

[dependencies]
rpm-spec.workspace             = true
rpm-spec-profile.workspace     = true
rpm-spec-repo-core     = { workspace = true, optional = true }
rpm-spec-repo-resolver = { workspace = true, optional = true }
schemars.workspace   = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
toml.workspace       = true
tracing.workspace    = true
time.workspace       = true
# Used by `config_cache::default_config_path` to resolve the XDG
# config dir (~/.config/rpm-spec-tool/rpmspec.toml). Version pinned
# to match `rpm-spec-repo-metadata`'s use so cargo doesn't pull two
# copies of `directories`.
directories = "5"

[dev-dependencies]
toml = { workspace = true, features = ["display"] }
tempfile = "3"

[features]
default = []
# Enables repository-backed rules and the APIs that pass repository data into
# analyzer sessions. The CLI opts in; SPEC-local library consumers need not.
repo = ["dep:rpm-spec-repo-core", "dep:rpm-spec-repo-resolver"]
# Exposes `crate::rules::repo::test_fixtures` (tiny RepoUniverse +
# `redos_profile()`) as a public module so analyzer integration tests
# can share fixtures with unit tests. This feature includes `repo` because the
# fixtures and the integration test use repository APIs.
test-fixtures = ["repo"]

[[test]]
name = "repo_lints_smoke"
required-features = ["test-fixtures"]

# Document the supported repository API without exposing the internal
# `test-fixtures` module through `all-features`.
[package.metadata.docs.rs]
features = ["repo"]
rustdoc-args = ["--cfg", "docsrs"]


[lints]
workspace = true
